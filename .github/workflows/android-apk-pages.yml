name: Publish verified Android APK
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: HTTPS source of the APK; used only during this build
        required: true
        type: string
      filename:
        description: Versioned APK filename
        required: true
        type: string
      sha256:
        description: Expected SHA256 of the locally built APK
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: android-apk-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Download and verify the APK
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FILENAME: ${{ inputs.filename }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$FILENAME" =~ ^sharenavi-[0-9]+\.[0-9]+\.[0-9]+\.apk$ ]]
          [[ "$SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SOURCE_URL" == https://* ]]
          mkdir public
          status=$(curl --fail --silent --show-error --retry 2 --max-time 180 \
            --location --max-redirs 3 --proto-redir '=https' \
            --user-agent 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36' \
            --proto '=https' --output public/sharenavi.apk --write-out '%{http_code}' "$SOURCE_URL")
          echo "APK source final HTTP status: $status"
          [[ "$status" == 200 ]]
          printf '%s  %s\n' "$SHA256" public/sharenavi.apk | sha256sum --check -
          printf '%s  sharenavi.apk\n' "$SHA256" > public/sharenavi.apk.sha256
          printf '{"filename":"%s","sha256":"%s","signing":"test","realDeviceVerified":false}\n' "$FILENAME" "$SHA256" > public/release.json
          printf '%s\n' '<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シェアナビくん Android検証版</title><style>body{font:16px sans-serif;max-width:44rem;margin:3rem auto;padding:1.5rem;line-height:1.8}a{display:block;padding:1rem;background:#126b60;color:white;text-align:center;text-decoration:none;border-radius:.5rem}code{overflow-wrap:anywhere}</style><h1>シェアナビくん Android検証版</h1><p>新規アプリの機能検証版です。テスト署名を使用しています。実機インストール・動作確認済みという意味ではありません。正式アイコンは原本未入手のため未適用です。</p>' > public/index.html
          printf '<a download="%s" href="sharenavi.apk">%s をダウンロード</a><p>SHA256: <code>%s</code></p><p>v0.2.8は共有操作を変更せず、受領した元URLを利用者の操作でそのままGoogle Mapsへ渡す検証版です。短縮URLの転送先は安全確認だけに使い、送出URLの展開・再構築・出発地削除・推測座標への置換はしません。既知の自動ナビ指定や外部ホストへの転送は停止します。座標の確定と原URLの引き渡しを別に判定します。</p><p>AndroidのEXTRA_TEXT・MIME・ClipData等を記録し、原文のSHA256を比較します。対応APIでは記録も受信端末まで保存します。本番APIが旧版の場合は共有文字列だけを変更せず送り、MIME等が未転送であることを送信画面に明示します。古い履歴の元MIMEは推定しません。実共有URL5件の開発API往復と原URL維持は検証済みですが、受領Intentは試験データであり、Quick Shareが受け取った実データそのものとの比較・Android実機でのGoogle Maps地点一致は未検証です。</p><p>元URLの隔離Web確認と、明示座標・公式場所IDの手動連携も維持します。配達NAVITIMEは未確認のため無効のままです。Google Maps側で配達先を確認してからナビを始めてください。正式アイコンは原本未入手のため未適用です。運転中は操作しないでください。</p></html>\n' "$FILENAME" "$FILENAME" "$SHA256" >> public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: publish
